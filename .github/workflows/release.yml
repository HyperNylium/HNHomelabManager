name: Build image on Release

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"   # e.g. "v1.2.3"

          OWNER="${GITHUB_REPOSITORY%/*}"
          OWNER_LC="${OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/hnhomelabmanager"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:latest

      - name: Generate release checksum (digest)
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          {
            echo "image=${{ steps.vars.outputs.image }}"
            echo "tag=${{ steps.vars.outputs.version }}"
            echo "latest=true"
            echo "digest=${DIGEST}"
          } > release-sha256.txt
          echo "Wrote release-sha256.txt:"
          cat release-sha256.txt

      - name: Upload checksum to the Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-sha256.txt
