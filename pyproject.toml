[project]
name = "hnhomelabmanager"
version = "1.0.0"
description = "Discord bot for HNHomelab"
requires-python = ">=3.13,<3.14"
dependencies = [
    "discord.py",
    "aiohttp",
    # ships the IANA timezone database so ZoneInfo works even on systems
    # that don't have one (alpine, minimal containers). without this,
    # ZoneInfo("America/New_York") raises and we fall back to UTC.
    "tzdata",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "RUF"]
ignore = ["E501", "UP015", "E712"]
extend-select = ["TID252"]
