[project]
name = "HNHomelabManager"
version = "1.0.0"
description = "Discord bot for HNHomelab"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.14.0",
    "discord-py>=2.7.1",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "RUF"]
ignore = ["line-too-long", "redundant-open-modes", "true-false-comparison"]
extend-select = ["relative-imports"]
